name: tests

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check agent_eval tests examples scripts
      - name: Ruff format
        run: ruff format --check agent_eval tests examples scripts
      - name: Mypy
        run: mypy

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q --cov-report=xml
      - name: Validate tasks
        run: |
          agent-eval validate tasks
          agent-eval validate examples/tasks
      - name: Library example
        run: python examples/library_usage.py
      - name: Offline demo and report
        run: |
          agent-eval demo --out results/demo
          agent-eval report results/demo
